site_name: UAV Simulator Docs
site_description: Документация sim-to-real платформы для симуляции и реального стенда
site_url: https://uav-simulator.github.io/uavsimulator/
docs_dir: docs
site_dir: .mkdocs-site
strict: false
exclude_docs: |
  report/**
  master-thesis/**
  sfu-templates/**
  tasks.md
  sample-city-autonomy.md
  prediploma-practice.md

# Validation is intentionally lenient because several product pages link to
# source files outside `docs_dir`; mkdocs treats those repo links as missing.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Старт: README.md
  - О продукте: about-simulator.md
  - Установка: installation.md
  - Использование: usage.md
  - CLI: cli.md
  - Архитектура: architecture.md
  - API: api.md
  - Model Lifecycle: model-lifecycle.md
  - Глоссарий: glossary.md
  - Обучение моделей: training.md
