site_name: UAV Simulator Docs
site_description: Документация sim-to-real платформы для симуляции и реального стенда
site_url: https://nmgorovenko.github.io/uav-simulator/
repo_url: https://github.com/NMGorovenko/uav-simulator
repo_name: NMGorovenko/uav-simulator
edit_uri: blob/develop/docs/
docs_dir: docs
site_dir: .mkdocs-site
strict: false
exclude_docs: |
  tasks.md
  tasks/**
  engineering-log.md
  research-index.md
  documentation-cleanup-plan.md
  roadmap.md
  reports/**

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Старт: README.md
  - О продукте: about-simulator.md
  - Установка: installation.md
  - Использование: usage.md
  - CLI: cli.md
  - Архитектура: architecture.md
  - API: api.md
  - Преддипломная практика:
      - Обзор: prediploma-practice.md
      - Спринт 1: report/prediploma-practice/sprint-1-changelog.md
      - Спринт 2: report/prediploma-practice/sprint-2-changelog.md
      - Спринт 3: report/prediploma-practice/sprint-3-changelog.md
  - Плагины:
      - Обзор: plugins.md
      - Роботы: vehicles.md
      - Как добавить робота: plugin-vehicle-guide.md
  - Сборка и релизы:
      - Локальная сборка и запуск: build.md
      - Поставка и обновление: release-distribution-model.md
      - Release Manifest: release-manifest.md
  - Контракты:
      - Обзор контрактов: contracts.md
      - Product Definition: product-definition.md
      - Unified Runtime Contract: unified-runtime-contract.md
      - Autopilot Integration Contract: autopilot-integration-contract.md
      - Simulator Scenario Config Contract: simulator-scenario-config-contract.md
  - CI/CD: ci.md
  - Статус проекта:
      - Roadmap: roadmap.md
      - Definition of Done MVP: definition-of-done-mvp.md
