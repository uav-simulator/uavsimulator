site_name: UAV Simulator Docs
site_description: Документация sim-to-real платформы для симуляции и реального стенда
site_url: https://nmgorovenko.github.io/uav-simulator/
repo_url: https://github.com/NMGorovenko/uav-simulator
repo_name: NMGorovenko/uav-simulator
edit_uri: blob/develop/docs/
docs_dir: docs
site_dir: .mkdocs-site
strict: false
exclude_docs: |
  assets.md
  autopilot-integration-contract.md
  build.md
  ci.md
  contracts.md
  definition-of-done-mvp.md
  tasks.md
  tasks/**
  engineering-log.md
  experiments.md
  mlagents.md
  overview.md
  plugin-vehicle-guide.md
  plugins.md
  product-definition.md
  release-distribution-model.md
  release-manifest.md
  research-index.md
  report/ReportTemplates/**
  report/practice/**
  report/prediploma-practice/README.md
  report/prediploma-practice/ab-corridor-kpi-2026-03-29.md
  report/prediploma-practice/ab-corridor-simulation-spec.md
  report/prediploma-practice/calendar_plan.md
  report/prediploma-practice/final_report_draft.md
  report/prediploma-practice/individual_assignment_draft.md
  report/prediploma-practice/interim_report_1_draft.md
  report/prediploma-practice/interim_report_2_draft.md
  report/prediploma-practice/model-lifecycle-contract.md
  report/prediploma-practice/source/**
  report/prediploma-practice/verification-2026-03-29.md
  report/prediploma-practice/*.docx
  robots/**
  documentation-cleanup-plan.md
  roadmap.md
  reports/**
  ros2.md
  simulator-scenario-config-contract.md
  stack.md
  unified-runtime-contract.md
  vehicles.md

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Старт: README.md
  - О продукте: about-simulator.md
  - Установка: installation.md
  - Использование: usage.md
  - CLI: cli.md
  - Архитектура: architecture.md
  - API: api.md
  - Model Lifecycle: model-lifecycle.md
  - Преддипломная практика:
      - Обзор: prediploma-practice.md
      - Спринт 1: report/prediploma-practice/sprint-1-changelog.md
      - Спринт 2: report/prediploma-practice/sprint-2-changelog.md
      - Спринт 3: report/prediploma-practice/sprint-3-changelog.md
