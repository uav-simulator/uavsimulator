[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sim-client"
version = "0.1.0"
description = "Python client for uav-simulator HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0",
]

[project.scripts]
uavsim = "sim_client.cli:main"

[tool.setuptools]
packages = ["sim_client"]
