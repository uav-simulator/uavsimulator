scenarioId: demo
displayName: Demo Scenario
description: Базовый демонстрационный сценарий с RoadSystem картой и KS0223.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.roadsystem_arena.v1

vehicle:
  vehicleId: vehicle.ks0223.arcade.blue.v1
  params:
    camera.profile: balanced

sensors:
  camera:
    enabled: true
    profile: balanced
  telemetry:
    profile: default
  lineTracker:
    enabled: true
  ultrasonic:
    enabled: true

route:
  waypoints:
    - [-6.0, -8.5]
    - [-6.0, -2.5]
    - [-1.0, 1.5]
    - [4.8, -1.5]
    - [6.0, 5.8]
  loop: true
  reachDistanceM: 1.3

agents:
  count: 1
  isolated: true
  seeEachOther: false

logging:
  enabled: true
  tag: demo
