scenarioId: showcase-city
displayName: Showcase City (cinematic demo)
description: |
  Cinematic demo scenario over the POLYGON City Pack intersection. One Prometeo
  sports car acts as the AI ego (driven via the ground-truth
  TrafficLightAwareController gate for the current presentation route), and one
  arcade racing car circulates as lightweight NPC traffic with the same
  rule-based traffic-light gates. The smaller default traffic set
  keeps the sales/demo frame readable; extra agents can still be added from WebUI.
  Camera is meant to be driven by
  the CinematicCameraController on the showcase camera rig (ShowcaseAngles asset)
  with the ShowcaseVolume URP post-processing profile attached.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.city_polygon.v1

vehicle:
  vehicleId: vehicle.prometeo.sport.v1
  params:
    camera.profile: high

# Waypoint route is shared across agents through the city.default graph wired in the
# scene; the explicit waypoint list below is a navigational hint for the editor
# preview and the WaypointFollowerVehicle fallback path when the graph reference is
# missing.
route:
  params:
    spawn.position: -4.000,0.200,-20.000
    spawn.yaw_deg: 0
    controller.profile: waypoint_follower
    waypoint.graph: city.default
  waypoints:
    - [-4.0, -20.0]
    - [-4.0, -12.0]
    - [-4.0, -4.0]
    - [-4.0, 6.0]
    - [-4.0, 18.0]
  loop: false
  reachDistanceM: 2.0

agents:
  isolated: false
  seeEachOther: true
  collisionsEnabled: false
  # Demo behavior uses the deterministic ground-truth gate. The visual ONNX
  # traffic-light classifier remains a research/presentation artifact until its
  # dataset is strong enough to release the vehicle reliably after Green.
  vehicles:
    - agentId: ego
      vehicleId: vehicle.prometeo.sport.v1
      primary: true
      spawnPose:
        position: [-4.0, 0.2, -20.0]
        yawDeg: 0
      params:
        controller.profile: waypoint_follower
        waypoint.graph: city.default
        gate.kind: ground_truth
    - agentId: npc-blue
      vehicleId: vehicle.arcade.blue.v1
      spawnPose:
        position: [2.0, 0.2, -0.9]
        yawDeg: 90
      params:
        controller.profile: waypoint_follower
        waypoint.graph: city.default
        gate.kind: ground_truth
logging:
  enabled: true
  tag: showcase-city
