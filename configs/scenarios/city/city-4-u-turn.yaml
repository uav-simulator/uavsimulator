scenarioId: city-4-u-turn
displayName: "City Curriculum 4 — U-turn"
description: |
  Прямой путь 20 м на север, разворот на 180° на дальней точке, обратный путь
  на юг. Тестирует способность policy выполнить разворот в один приём (или
  серией микро-маневров) на ограниченной полосе движения.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 2.0
  seed: 1004

world:
  trackId: track.city_polygon.v1

vehicle:
  vehicleId: vehicle.arcade.blue.v1
  params:
    camera.profile: high

route:
  params:
    spawn.position: "0.000,0.200,-15.000"
  waypoints:
    - [0.0, -15.0]
    - [0.0, -5.0]
    - [0.0, 5.0]
    - [0.0, 15.0]
    - [3.0, 15.0]
    - [3.0, 5.0]
    - [3.0, -5.0]
    - [3.0, -15.0]
  reachDistanceM: 1.5

agents:
  isolated: true
  seeEachOther: false
  collisionsEnabled: false
