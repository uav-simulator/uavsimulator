scenarioId: city-3-left-turns
displayName: "City Curriculum 3 — Two left turns"
description: |
  Зеркало city-2: два левых поворота на 90°.
  Спавн в нижнем-правом, движение север → запад → юг → восток.
  Тестирует способность policy выполнить разворот налево.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 2.0
  seed: 1003

world:
  trackId: track.city_polygon.v1

vehicle:
  vehicleId: vehicle.arcade.blue.v1
  params:
    camera.profile: high

route:
  params:
    spawn.position: "15.000,0.200,-15.000"
  waypoints:
    - [15.0, -15.0]
    - [15.0, 0.0]
    - [15.0, 15.0]
    - [0.0, 15.0]
    - [-15.0, 15.0]
  reachDistanceM: 1.5

agents:
  isolated: true
  seeEachOther: false
  collisionsEnabled: false
