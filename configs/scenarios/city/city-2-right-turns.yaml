scenarioId: city-2-right-turns
displayName: "City Curriculum 2 — Two right turns"
description: |
  Маршрут квадратом против часовой: два правых поворота на 90° каждый.
  Спавн в нижнем-левом углу, движение → север → восток → юг → запад → стоп.
  Тестирует способность policy выполнить разворот направо.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 2.0
  seed: 1002

world:
  trackId: track.city_polygon.v1

vehicle:
  vehicleId: vehicle.arcade.blue.v1
  params:
    camera.profile: high

route:
  params:
    spawn.position: "-15.000,0.200,-15.000"
  waypoints:
    - [-15.0, -15.0]
    - [-15.0, 0.0]
    - [-15.0, 15.0]
    - [0.0, 15.0]
    - [15.0, 15.0]
  reachDistanceM: 1.5

agents:
  isolated: true
  seeEachOther: false
  collisionsEnabled: false
