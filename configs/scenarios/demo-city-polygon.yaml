scenarioId: demo-city-polygon
displayName: City Demo (POLYGON pack)
description: |
  PROMETEO-машина едет по lane-aligned маршруту DemoScene-среза POLYGON City Pack
  и останавливается на светофоре ego-подхода. Демонстрация плагинной архитектуры:
  track.city_polygon.v1 и vehicle.prometeo.sport.v1 используют ассеты сторонних пакетов.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.city_polygon.v1

vehicle:
  vehicleId: vehicle.prometeo.sport.v1
  params:
    camera.profile: high

route:
  params:
    spawn.position: -4.000,0.200,-20.000
    spawn.yaw_deg: 0
    controller.profile: waypoint_follower
    waypoint.graph: city.default
  waypoints:
    - [-4.0, -20.0]
    - [-4.0, -12.0]
    - [-4.0, -4.0]
    - [-4.0, 6.0]
    - [-4.0, 18.0]
  loop: false
  reachDistanceM: 2.0

agents:
  isolated: false
  seeEachOther: true
  collisionsEnabled: false
  vehicles:
    - agentId: ego
      vehicleId: vehicle.prometeo.sport.v1
      primary: true
      spawnPose:
        position: [-4.0, 0.2, -20.0]
        yawDeg: 0
      params:
        controller.profile: waypoint_follower
        waypoint.graph: city.default
        gate.kind: ground_truth

logging:
  enabled: true
  tag: demo-city-polygon
