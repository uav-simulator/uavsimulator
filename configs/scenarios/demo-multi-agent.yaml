scenarioId: demo-multi-agent
displayName: Multi-Agent Demo
description: Две машинки KS0223 на одном треке с адресным управлением через rusim.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.roadsystem_realistic.v2

vehicle:
  vehicleId: vehicle.arcade.blue.v1
  params:
    camera.profile: high

route:
  params:
    spawn.position: -11.000,0.200,-11.800
  waypoints:
    - [-11.0, -13.5]
    - [-10.5, -4.5]
    - [-6.0, 3.5]
    - [1.5, 7.5]
    - [9.5, 2.5]
    - [10.5, -6.5]
    - [4.5, -12.5]
  loop: true
  reachDistanceM: 1.4

agents:
  isolated: false
  seeEachOther: true
  collisionsEnabled: false
  vehicles:
    - agentId: ego
      vehicleId: vehicle.arcade.blue.v1
      primary: true
      spawnPose:
        position: [-11.0, 0.2, -13.5]
        yawDeg: 3
    - agentId: npc-red
      vehicleId: vehicle.arcade.red.v1
      spawnPose:
        position: [-11.0, 0.2, -10.8]
        yawDeg: 3

logging:
  enabled: true
  tag: demo-multi-agent
