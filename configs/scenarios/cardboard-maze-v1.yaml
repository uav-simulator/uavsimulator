scenarioId: cardboard-maze-v1
displayName: Cardboard Maze (Procedural)
description: Procedurally generated cardboard corridor with configurable turns.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.cardboard_maze.v1
  params:
    maze.seed: 42
    maze.length_cells: 8
    maze.corridor_width_m: 0.60
    maze.left_turns: 2
    maze.right_turns: 2
    maze.wall_height_m: 0.25

vehicle:
  vehicleId: vehicle.ks0223.v1
  params:
    camera.profile: high

sensors:
  camera:
    enabled: true
    profile: high
  telemetry:
    profile: default
  lineTracker:
    enabled: false
  ultrasonic:
    enabled: true

route:
  # Waypoints auto-generated by the track — don't hardcode here
  params:
    goal.radius_m: 0.24
  loop: false
  reachDistanceM: 0.24

agents:
  count: 1
  isolated: true
  seeEachOther: false

logging:
  enabled: true
  tag: cardboard-maze-v1
