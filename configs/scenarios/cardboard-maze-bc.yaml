scenarioId: cardboard-maze-bc
displayName: Cardboard Maze (BC bootstrap demos — long + twisty)
description: |
  Longer procedural maze for BC bootstrap recording. ~25 cells with 4-5 turns
  each way → real start-to-finish navigation, not just one L-bend. seed=42
  baseline; pass --seed N to scenario reset for per-episode variety.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.cardboard_maze.v1
  params:
    maze.seed: 42
    maze.length_cells: 30           # 30 cells × 0.45m = 13.5m total navigation path
    maze.corridor_width_m: 0.45     # tight enough to demand deliberate steering (14cm clearance each side)
    maze.left_turns: 6              # L=30 with T=6 works for 25/29 seeds in 42..70; L=40 was pathological
    maze.right_turns: 6
    maze.path_encoded: "20,20;20,21;20,22;19,22;18,22;17,22;16,22;15,22;14,22;14,23;14,24;14,25;14,26;14,27;14,28;14,29;14,30;15,30;16,30;16,29;17,29;18,29;19,29;19,28;20,28;20,29;20,30;20,31;19,31;18,31"
    maze.wall_height_m: 0.25

vehicle:
  vehicleId: vehicle.ks0223.v1
  params:
    camera.profile: high

sensors:
  camera:
    enabled: true
    profile: high
  telemetry:
    profile: default
  ultrasonic:
    enabled: true

route:
  params:
    goal.radius_m: 0.24
  loop: false
  reachDistanceM: 0.24

agents:
  count: 1
  isolated: true

logging:
  enabled: true
  tag: cardboard-maze-bc
