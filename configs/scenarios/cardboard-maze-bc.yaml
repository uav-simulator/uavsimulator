scenarioId: cardboard-maze-bc
displayName: Cardboard Maze (BC bootstrap demos — long + twisty)
description: |
  Longer procedural maze for BC bootstrap recording. ~25 cells with 4-5 turns
  each way → real start-to-finish navigation, not just one L-bend. seed=42
  baseline; pass --seed N to scenario reset for per-episode variety.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.cardboard_maze.v1
  params:
    maze.seed: 42
    maze.length_cells: 40           # was 25 — longer total path → real start-to-finish navigation
    maze.corridor_width_m: 0.45     # was 0.60 — tighter, more realistic navigation challenge
    maze.left_turns: 3              # was 5 — fewer turns → longer corridor segments between them
    maze.right_turns: 3             # was 5
    maze.wall_height_m: 0.25

vehicle:
  vehicleId: vehicle.ks0223.v1
  params:
    camera.profile: high

sensors:
  camera:
    enabled: true
    profile: high
  telemetry:
    profile: default
  ultrasonic:
    enabled: true

route:
  params:
    goal.radius_m: 0.24
  loop: false
  reachDistanceM: 0.24

agents:
  count: 1
  isolated: true

logging:
  enabled: true
  tag: cardboard-maze-bc
