scenarioId: cardboard-maze-curated-short
displayName: Cardboard Maze (curated short BC demos)
description: |
  Short fixed maze path used for curated BC bootstrap sanity checks. This file
  preserves the 12-cell seed=42 path separately from the full 30-cell maze so
  short-path BC validation cannot be confused with full maze training.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.cardboard_maze.v1
  params:
    maze.seed: 42
    maze.length_cells: 12
    maze.corridor_width_m: 0.45
    maze.left_turns: 2
    maze.right_turns: 1
    maze.path_encoded: "20,20;20,21;20,22;20,23;20,24;20,25;19,25;18,25;18,24;18,23;17,23;16,23"
    maze.wall_height_m: 0.25

vehicle:
  vehicleId: vehicle.ks0223.v1
  params:
    camera.profile: high

sensors:
  camera:
    enabled: true
    profile: high
  telemetry:
    profile: default
  ultrasonic:
    enabled: true

route:
  params:
    goal.radius_m: 0.24
  loop: false
  reachDistanceM: 0.24

agents:
  count: 1
  isolated: true

logging:
  enabled: true
  tag: cardboard-maze-curated-short
