scenarioId: demo-swarm
displayName: Multi-Agent Swarm Demo
description: 16 машин разных цветов в круговой формации, для showcase parallel-training визуализации.
version: 1

runtime:
  runtimeMode: unity-sim
  headless: false
  timeScale: 1.0
  seed: 42

world:
  trackId: track.basic_arena.v1

vehicle:
  vehicleId: vehicle.arcade.blue.v1
  params:
    camera.profile: high

# Generated by python/sim_client/scripts/generate_swarm_scenario.py
#   --n 16 --radius 8 --colors blue,red,gray,purple
# Cars sit on a radius-8m circle in the x-z plane (y=0.2 spawn height) and face
# the CCW tangent so the swarm visually rotates around the arena origin.
agents:
  isolated: false
  seeEachOther: true
  collisionsEnabled: false
  vehicles:
    - agentId: ego
