name: Release Manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate manifest JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_release_manifest.py github-release \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --output dist/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json

      - name: Upload manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json
          overwrite_files: true

      - name: Upload manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.meta.outputs.tag }}
          path: dist/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json
