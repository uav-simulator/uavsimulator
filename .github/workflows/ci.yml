name: CI

on:
  push:
  pull_request:

jobs:
  backend-build:
    name: Backend build (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore and build backend
        run: |
          dotnet restore
          dotnet build --no-restore
        working-directory: src/ks0223-web-mac/backend

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ks0223-web-mac/frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: src/ks0223-web-mac/frontend
      - name: Build
        run: npm run build
        working-directory: src/ks0223-web-mac/frontend

  unity-tests:
    name: Unity Tests (GameCI)
    if: ${{ secrets.UNITY_LICENSE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: src/UnityProject/uav-simulator
          unityVersion: 6000.1.8f1
          testMode: all
          artifactsPath: artifacts

  python-lint:
    name: Python (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
      - name: Import check
        run: |
          python -c "from sim_client.http_client import SimClient; print(SimClient)"
        working-directory: python

  demo-proof-ci:
    name: Demo Proof (graceful skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo proof smoke
        run: make demo-proof-ci
