name: CI

on:
  push:
  pull_request:

jobs:
  unity-tests:
    name: Unity Tests (GameCI)
    if: ${{ secrets.UNITY_LICENSE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: src/UnityProject/uav-simulator
          unityVersion: 6000.1.8f1
          testMode: all
          artifactsPath: artifacts

  python-lint:
    name: Python (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
      - name: Import check
        run: |
          python -c "from sim_client.http_client import SimClient; print(SimClient)"
        working-directory: python
