name: Release Runtime

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-runtime:
    name: Windows runtime
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Tag must start with 'v' (got: $tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          lfs: true

      - name: Build Windows runtime
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: src/UnityProject/uav-simulator
          unityVersion: 6000.1.8f1
          targetPlatform: StandaloneWindows64
          buildMethod: UavSimulator.EditorTools.RuntimeBuildPipeline.BuildWindowsRuntime

      - name: Package Windows runtime
        id: package
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          asset_name="uav-simulator-windows-${RELEASE_TAG}.zip"
          output_dir="dist/runtime/${RELEASE_TAG}"
          runtime_dir="src/UnityProject/uav-simulator/build/runtime/windows"
          test -f "${runtime_dir}/uav-simulator.exe"
          rm -rf "${runtime_dir}"/*_BurstDebugInformation_DoNotShip
          mkdir -p "$output_dir"
          (cd "$runtime_dir" && zip -qr "${GITHUB_WORKSPACE}/${output_dir}/${asset_name}" .)
          (cd "$output_dir" && sha256sum "$asset_name" > "${asset_name}.sha256")
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=${output_dir}/${asset_name}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${output_dir}/${asset_name}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload runtime to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          sleep 5
          python scripts/generate_release_manifest.py github-release \
            --repo "${{ github.repository }}" \
            --tag "$RELEASE_TAG" \
            --output "dist/runtime/${RELEASE_TAG}/rusim-release-manifest.json"

      - name: Upload refreshed manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/runtime/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json
          overwrite_files: true

      - name: Upload runtime as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-${{ steps.meta.outputs.tag }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
            dist/runtime/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json
