name: Release Runtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  unity-license-gate:
    name: Unity license gate (release)
    runs-on: ubuntu-latest
    steps:
      - name: Check UNITY_LICENSE
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE secret is required for tag release build."
            exit 1
          fi

  build-and-release:
    name: Build runtime and publish release assets
    needs: unity-license-gate
    runs-on: ubuntu-latest
    env:
      RUSIM_BUILD_OUTPUT: build/runtime/macos/uav-simulator.app
      RUSIM_BUILD_SCENE: Assets/Scenes/TrackScence.unity
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Tag must start with 'v' (got: $tag)"
            exit 1
          fi
          version="${tag#v}"
          asset_name="uav-simulator-macos-${tag}.zip"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${asset_name}.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - name: Build StandaloneOSX runtime (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          RUSIM_BUILD_OUTPUT: ${{ env.RUSIM_BUILD_OUTPUT }}
          RUSIM_BUILD_SCENE: ${{ env.RUSIM_BUILD_SCENE }}
        with:
          projectPath: src/UnityProject/uav-simulator
          unityVersion: 6000.1.8f1
          targetPlatform: StandaloneOSX
          buildMethod: UavSimulator.EditorTools.RuntimeBuildPipeline.BuildMacOsRuntime
          allowDirtyBuild: true

      - name: Package runtime archive
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          test -d build/runtime/macos/uav-simulator.app
          mkdir -p "dist/${TAG}"
          rm -f "dist/${TAG}/${{ steps.meta.outputs.asset_name }}"
          (
            cd build/runtime/macos
            zip -yr "../../../dist/${TAG}/${{ steps.meta.outputs.asset_name }}" uav-simulator.app
          )
          shasum -a 256 "dist/${TAG}/${{ steps.meta.outputs.asset_name }}" > "dist/${TAG}/${{ steps.meta.outputs.checksum_name }}"

      - name: Publish runtime assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: uav-simulator ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.asset_name }}
            dist/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.checksum_name }}
          fail_on_unmatched_files: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate release manifest JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_release_manifest.py github-release \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --output "dist/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json"

      - name: Publish release manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/${{ steps.meta.outputs.tag }}/rusim-release-manifest.json
          overwrite_files: true
